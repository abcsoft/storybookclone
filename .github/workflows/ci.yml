name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migration smoke test (empty DB + existing baseline)
        run: npm run test:integration

      - name: Secrets scan
        run: npm run secrets:scan

      - name: Production build
        run: npm run build

      - name: Install Chromium (for the real-browser e2e journey)
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser journey (real Chromium against local D1/R2)
        run: npm run test:e2e

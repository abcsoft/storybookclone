<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Personalised story spread placeholder">
  <title>Personalised story spread placeholder</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#paper)"/>
  <line x1="300" y1="40" x2="300" y2="560" stroke="#ddd6fe" stroke-width="6"/>
  <text x="150" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#6d28d9">Story page</text>
  <text x="450" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#6d28d9">Illustration</text>
  <text x="300" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8b5cf6">Preview artwork placeholder</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#fff"/>
  <!-- Wizard / Superhero sheet -->
  <g transform="translate(60 100)">
    <rect width="320" height="280" rx="22" fill="#8b30ee"/>
    <polygon points="160,40 30,260 290,260" fill="#c79bff"/>
    <circle cx="160" cy="180" r="40" fill="#ffe2c8"/>
    <text x="160" y="320" text-anchor="middle" font-family="Figtree" font-size="22" fill="#fff" font-weight="800">Wizard</text>
  </g>
  <g transform="translate(420 100)">
    <rect width="320" height="280" rx="22" fill="#a855f7"/>
    <circle cx="160" cy="150" r="44" fill="#ffe2c8"/>
    <path d="M160 200 L160 280" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <path d="M120 240 L200 240" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <text x="160" y="320" text-anchor="middle" font-family="Figtree" font-size="22" fill="#fff" font-weight="800">Superhero</text>
  </g>
  <text x="400" y="640" text-anchor="middle" font-family="Figtree" font-size="36" fill="#7424d8" font-weight="800">Wizard &amp; Superhero</text>
  <text x="400" y="690" text-anchor="middle" font-family="Figtree" font-size="20" fill="#a855f7">Sticker sheet</text>
</svg>
